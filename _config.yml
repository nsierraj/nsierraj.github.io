# The Site Configuration

theme: beautiful-jekyll-theme

title: Amado Sierra
author: Amado Sierra
description: Notes and posts from Amado Sierra
rss-description: Notes and posts from Amado Sierra

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://nsierraj.github.io"
url-pretty: "nsierraj.github.io"
baseurl: ""

timezone: UTC

navbar-links:
  About: "/about/"
  Tags: "/tags/"

# og:image fallback (the header brand mark reads /favicon.svg directly)
avatar: "/favicon.svg"

social-network-links:
  github: nsierraj
  linkedin: amadosierra
  rss: true

share-links-active:
  linkedin: true
  twitter: true
  facebook: false

title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
date_format: "%B %-d, %Y"

# Colors, type and spacing live in assets/css/site.css (design tokens, light + dark), not here.
# The theme's color keys (page-col, link-col, navbar-col, ...) are deliberately unset.
site-js:
  - "/assets/js/theme.js"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

paginate: 10
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-target-blank

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: "posts"
    values:
      layout: post
      comments: false
      social-share: true
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
      head-extra: ["favicons.html", "site-theme.html"]
  - scope:
      path: ""
    values:
      layout: page
      head-extra: ["favicons.html", "site-theme.html"]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - CLAUDE.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
