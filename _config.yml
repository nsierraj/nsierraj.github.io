# The Site Configuration

theme: beautiful-jekyll-theme

title: Amado Sierra
author: Amado Sierra
description: Notes and posts from Amado Sierra
rss-description: Notes and posts from Amado Sierra

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://nsierraj.github.io"
url-pretty: "nsierraj.github.io"
baseurl: ""

timezone: America/New_York

navbar-links:
  About: "/about/"
  Tags: "/tags/"
  ServiceNow Learning: "https://learning.servicenow.com/lxp/en/pages/nl-public-resume?id=nl_public&user=amadosierr961983"

# the avatar in the navbar, support local or CORS resources
avatar: "/favicon.svg"
round-avatar: false

social-network-links:
  github: nsierraj
  linkedin: amadosierra
  rss: true

share-links-active:
  linkedin: true
  twitter: true
  facebook: false

title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
date_format: "%B %-d, %Y"

# Color scheme — carries over the site's dark-blue accent color
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#1a4fa0"
hover-col: "#153f80"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#1a4fa0"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

paginate: 10
plugins:
  - jekyll-paginate
  - jekyll-sitemap

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: "posts"
    values:
      layout: post
      comments: false
      social-share: true
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
      head-extra: ["favicons.html"]
  - scope:
      path: ""
    values:
      layout: page
      head-extra: ["favicons.html"]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - CLAUDE.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
